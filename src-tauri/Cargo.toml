[package]
name = "javaforge"
version = "1.0.0"
description = "Construtor visual de aplicativos Java (Swing) com banco SQLite"
authors = ["Kelvin"]
edition = "2021"

[lib]
name = "javaforge_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
